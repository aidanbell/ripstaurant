name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: ripstaurant
          POSTGRES_PASSWORD: ripstaurant
          POSTGRES_DB: ripstaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripstaurant -d ripstaurant"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ripstaurant:ripstaurant@localhost:5432/ripstaurant
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      # Migrations apply cleanly to a fresh database, and a second run is a no-op.
      - run: bun run db:migrate
      - run: bun run db:migrate
