# Builds and deploys the site: export the dataset from Neon, build web/, check the output
# has no secrets, upload it to the `ripstaurant` Worker with wrangler (web/wrangler.jsonc),
# then check the live site. Runs on pushes to main that touch the site, after each successful
# Snapshot, and by hand. Never on pull requests.
#
# Each secret is in only the step that needs it: DATABASE_URL in the export,
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on this account only) in the upload.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contract/**"
      - "pipeline/src/export.ts"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: [Snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# The newest build wins; an older one still running is cancelled.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  SITE: https://ripstaurant.ca

jobs:
  deploy:
    # After a Snapshot, only if it succeeded: don't publish half-processed data.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Export the dataset
        run: bun run export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: bun run --filter @ripstaurant/web build

      # Defense in depth: everything in dist/ is public once uploaded.
      - name: Check the build has no secrets
        run: |
          if grep -rlE 'sk-ant-|postgres(ql)?://|neon\.tech|r2\.cloudflarestorage|nak_live_|nsk_live_|ghp_|github_pat_|BEGIN [A-Z ]*PRIVATE KEY|DATABASE_URL|CLOUDFLARE_API_TOKEN|S3_SECRET|fdrl_|svac_' web/dist; then
            echo "::error::The build contains something that looks like a secret; not deploying."
            exit 1
          fi
          if find web/dist -name '*.map' | grep -q .; then
            echo "::error::The build contains source maps; not deploying."
            exit 1
          fi
          echo "No secrets found in $(find web/dist -type f | wc -l) files."

      # Wrangler 4 (a pinned dev dependency of web/, so its lockfile hash is checked)
      # needs Node 22+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upload to Cloudflare
        working-directory: web
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      # A new version takes a few seconds to reach every Cloudflare edge; until then a
      # request can get the old files. And a data file that isn't there comes back as
      # index.html with a 200 (the single-page-app fallback), so check the content type
      # rather than trusting the status. Waits for this build's manifest (its `generated`
      # time), then checks the list it points at.
      - name: Check the live site
        run: |
          # Prints a URL's body if it's JSON; fails otherwise. The query string skips any
          # cached copy (Cloudflare caches by full URL; the file served is the same).
          json() {
            local body type
            body=$(curl -fsS -w '\n%{content_type}' "$1?deploy=$GITHUB_RUN_ID") || return 1
            type=${body##*$'\n'}
            [[ $type == application/json* ]] || return 1
            printf '%s' "${body%$'\n'*}"
          }

          expected=$(jq -r .generated web/dist/data/manifest.json)
          for attempt in $(seq 1 12); do
            manifest=$(json "$SITE/data/manifest.json") &&
              [ "$(jq -r .generated <<<"$manifest")" = "$expected" ] &&
              list=$(jq -r '.cities[0].list' <<<"$manifest") &&
              closures=$(json "$SITE/data/$list") &&
              break
            echo "Waiting for this deploy to go live (attempt $attempt of 12)…"
            manifest=""
            sleep 10
          done
          if [ -z "$manifest" ]; then
            echo "::error::$SITE isn't serving this build's data (export $expected) after 2 minutes."
            exit 1
          fi

          count=$(jq '.closures | length' <<<"$closures")
          echo "Live: $count closures ($list, export $expected)"
          test "$count" -gt 0
          curl -fsS -o /dev/null "$SITE/"
