# Builds and deploys the site: export the dataset from Neon, build web/, check the output
# has no secrets, upload it to the `ripstaurant` Worker (web/wrangler.jsonc), then check
# the live site. Runs on pushes to main that touch the site, after each successful
# Snapshot, and by hand. Never on pull requests.
#
# Each secret is in only the step that needs it: DATABASE_URL in the export,
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on this account only) in the upload.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contract/**"
      - "pipeline/src/export.ts"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: [Snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# The newest build wins; an older one still running is cancelled.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  SITE: https://ripstaurant.ca

jobs:
  deploy:
    # After a Snapshot, only if it succeeded: don't publish half-processed data.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Export the dataset
        run: bun run export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: bun run --filter @ripstaurant/web build

      # Defense in depth: everything in dist/ is public once uploaded.
      - name: Check the build has no secrets
        run: |
          if grep -rlE 'sk-ant-|postgres(ql)?://|neon\.tech|r2\.cloudflarestorage|nak_live_|nsk_live_|ghp_|github_pat_|BEGIN [A-Z ]*PRIVATE KEY|DATABASE_URL|CLOUDFLARE_API_TOKEN|S3_SECRET|fdrl_|svac_' web/dist; then
            echo "::error::The build contains something that looks like a secret; not deploying."
            exit 1
          fi
          if find web/dist -name '*.map' | grep -q .; then
            echo "::error::The build contains source maps; not deploying."
            exit 1
          fi
          echo "No secrets found in $(find web/dist -type f | wc -l) files."

      # Wrangler 4 needs Node 22+, and the action runs it with the job's Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upload to Cloudflare
        # Pinned to the v4.1.3 commit: this step holds the deploy token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        env:
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.140.0"
          command: deploy

      - name: Check the live site
        run: |
          manifest=$(curl -fsS "$SITE/data/manifest.json")
          list=$(echo "$manifest" | jq -r '.cities[0].list')
          count=$(curl -fsS "$SITE/data/$list" | jq '.closures | length')
          echo "Live: $count closures ($list)"
          test "$count" -gt 0
          curl -fsS -o /dev/null "$SITE/map"
