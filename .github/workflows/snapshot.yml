# Pulls the bulk open datasets twice a month: raw files to R2, new or changed rows to
# Neon, then refreshes the reference data (neighbourhoods, Address Points). Also runnable
# by hand from the Actions tab. GitHub emails on failure.

name: Snapshot

on:
  schedule:
    # 1st and 15th at 14:00 UTC, after the City's morning refresh.
    - cron: "0 14 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run snapshot --upload
      # Runs even if a snapshot dataset failed; each job reports its own failures.
      - if: ${{ !cancelled() }}
        run: bun run reference --upload
